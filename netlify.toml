[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
  # Only build when frontend/ or this file itself changed. Backend-only
  # commits (services/, Railway, etc.) don't affect this site, so skip the
  # build attempt entirely instead of wasting build minutes on a build
  # Netlify would cancel anyway.
  # NOTE (verified via the Netlify API on 2026-08-02): Netlify's deploy
  # list still reports these skips as state "error" with error_message
  # "Canceled build due to no content change" — the same way it already
  # reported them by default, with or without this `ignore` command. That
  # red/error labeling for benign no-op skips appears to be fixed platform
  # behavior, not something netlify.toml can change. This `ignore` command
  # is still worth keeping: it stops a real build from being attempted on
  # commits that can't possibly need one.
  # git diff --quiet exits 1 (build proceeds) when there are differences,
  # 0 (skip) when there are none — see https://docs.netlify.com/configure-builds/ignore-builds/
  # IMPORTANT: because `base = "frontend"`, Netlify runs this command with
  # its working directory already set to frontend/ — so paths here are
  # relative to frontend/, NOT the repo root. "." = frontend itself,
  # "../netlify.toml" = this file at the repo root.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Backend Railway (zma-gateway) — doit précéder le fallback SPA ci-dessous,
# sinon ce dernier intercepte tous les appels /api/v1/* et renvoie
# index.html (200 OK) au lieu du JSON attendu.
[[redirects]]
  from = "/api/v1/*"
  to = "https://zma-gateway-production.up.railway.app/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/oauth2/*"
  to = "https://zma-gateway-production.up.railway.app/oauth2/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/login/oauth2/*"
  to = "https://zma-gateway-production.up.railway.app/login/oauth2/:splat"
  status = 200
  force = true

# SPA : toutes les routes servent index.html (React Router côté client).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
