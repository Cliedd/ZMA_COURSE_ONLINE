name: Frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # npm ci : le lock est versionné (Linux ↔ Linux : local + CI tournent tous deux
      # sous Ubuntu, donc les dépendances natives sont portables). .npmrc fixe
      # legacy-peer-deps=true ce qui est respecté par npm ci.
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Tests
        run: npm run test:run
      - name: Build
        run: npm run build
