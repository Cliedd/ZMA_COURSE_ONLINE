name: Frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      # npm install (pas npm ci) : le lock n'est pas versionné car des dépendances
      # natives (sharp, @unrs/resolver) ont des deps optionnelles par plateforme
      # non portables. .npmrc fixe legacy-peer-deps=true.
      - run: npm install --no-audit --no-fund
      - name: Types, lint et tests
        run: npm run verify
      - name: Build
        run: npm run build
