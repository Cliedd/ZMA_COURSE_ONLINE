proxy_cache_path /var/cache/nginx/pollinations levels=1:2 keys_zone=img_zone:20m max_size=1g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 10s;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ── Proxy & cache Pollinations AI images ─────────────────────────────────
    location /pollinations/ {
        proxy_pass         https://image.pollinations.ai/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header   Host image.pollinations.ai;
        proxy_set_header   Accept "image/webp,image/jpeg,*/*";
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # Force nginx to cache regardless of upstream Cache-Control/Expires headers
        proxy_ignore_headers  Cache-Control Expires Vary Set-Cookie;
        proxy_hide_header     Cache-Control;
        proxy_hide_header     Pragma;

        proxy_cache                  img_zone;
        proxy_cache_key              "$uri$is_args$args";
        proxy_cache_valid            200 30d;
        proxy_cache_valid            any 1m;
        proxy_cache_use_stale        error timeout updating;
        proxy_cache_background_update on;
        proxy_cache_lock             on;
        proxy_cache_lock_timeout     120s;
        proxy_cache_lock_age         120s;

        # Large buffers for streaming/chunked responses
        proxy_buffering       on;
        proxy_buffer_size     128k;
        proxy_buffers         16 512k;
        proxy_busy_buffers_size 1m;
        proxy_temp_file_write_size 2m;
        proxy_max_temp_file_size   1024m;

        proxy_read_timeout    180s;
        proxy_connect_timeout 20s;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ── Proxy API → Gateway (:8080) ──────────────────────────────────────────
    location /api/v1/ {
        proxy_pass            http://zma-gateway:8080;
        proxy_http_version    1.0;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Connection        "";
        # Allow large video uploads (up to 2 GB)
        client_max_body_size  2g;
        proxy_read_timeout    600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_buffering       off;
        proxy_request_buffering off;
    }

    # ── Proxy WebSocket chat → Community service (:8087) ─────────────────────
    # Direct to the service, not through the gateway: the gateway is a
    # buffered RestTemplate proxy and cannot forward a WebSocket Upgrade.
    location /ws/ {
        proxy_pass         http://zma-community:8087/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Proxy OAuth2 → Auth service (:8081) ──────────────────────────────────
    location /oauth2/ {
        proxy_pass         http://zma-auth:8081;
        proxy_http_version 1.0;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location /login/oauth2/ {
        proxy_pass         http://zma-auth:8081;
        proxy_http_version 1.0;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   Connection        "";
    }

    # ── Assets statiques (cache long) ────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback (React Router) ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
