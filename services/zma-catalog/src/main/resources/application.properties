spring.application.name=zma-catalog
server.port=${SERVER_PORT:8083}

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zma_db}
spring.datasource.username=${DB_USER:zma_admin}
spring.datasource.password=${DB_PASSWORD:devpassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=catalog

# ── Connection pool ────────────────────────────────────────────────────────────
# Explicit sizing: Postgres max_connections=100 is shared by 7 DB-backed
# services, each defaulting to Hikari's own maximumPoolSize=10 (and eagerly
# opening minimumIdle=maximumPoolSize connections at startup) when unset.
# That put ~70 idle connections on the server at rest with zero traffic
# (confirmed via pg_stat_activity, 2026-08-05) — 70% of max_connections spent
# before a single request landed. catalog serves the highest-traffic public
# endpoint (course browsing) so it gets a slightly larger pool than the
# others; see sibling services for the matching comment.
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2

# ── JWT (validation only) ─────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
