spring.application.name=zma-gateway
server.port=${SERVER_PORT:8080}

# ── Routes vers les microservices ─────────────────────────────────────────────
gateway.auth-service.url=${AUTH_SERVICE_URL:http://zma-auth:8081}
gateway.users-service.url=${USERS_SERVICE_URL:http://zma-users:8082}
gateway.catalog-service.url=${CATALOG_SERVICE_URL:http://zma-catalog:8083}
gateway.media-service.url=${MEDIA_SERVICE_URL:http://zma-media:8084}
gateway.enrollment-service.url=${ENROLLMENT_SERVICE_URL:http://zma-enrollment:8085}
gateway.payment-service.url=${PAYMENT_SERVICE_URL:http://zma-payment:8086}
gateway.community-service.url=${COMMUNITY_SERVICE_URL:http://zma-community:8087}

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}

# ── Redis (rate limiting) ─────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

# ── Rate limiting ─────────────────────────────────────────────────────────────
gateway.rate-limit.max-requests=${GATEWAY_RATE_LIMIT:500}
gateway.rate-limit.window-seconds=${GATEWAY_RATE_WINDOW:60}

# ── Resilience4j circuit breakers ────────────────────────────────────────────
# "configs.default" is the shared base config template that resilience4j
# automatically applies to every circuit breaker instance that has no explicit
# "instances.<name>.*" entry of its own (auth, users, media, enrollment,
# payment, community — only "catalog" below has bespoke settings). Note this
# must be under "configs.default", NOT "instances.default": the latter would
# just create one more literal instance named "default" (never referenced by
# any @CircuitBreaker(name=...) in this service) and would NOT act as a
# fallback template, leaving the other six instances on resilience4j's
# built-in defaults instead of these values.
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.catalog.slidingWindowSize=10
resilience4j.circuitbreaker.instances.catalog.failureRateThreshold=50
resilience4j.circuitbreaker.instances.catalog.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.catalog.permittedNumberOfCallsInHalfOpenState=3

# ── Request body size / multipart passthrough ──────────────────────────────────
# The gateway is a raw byte-forwarding reverse proxy (see GatewayRouter#proxyBytes) —
# it never itself needs a parsed MultipartFile. Spring Boot auto-configures a
# StandardServletMultipartResolver whenever spring-boot-starter-web is on the
# classpath, and DispatcherServlet#checkMultipart() eagerly parses (and thereby
# CONSUMES) the raw request InputStream for *any* incoming request whose
# Content-Type is multipart/form-data — regardless of whether the matched handler
# method declares a MultipartFile parameter. Because proxyBytes() reads
# request.getInputStream() itself to forward the exact bytes upstream, that eager
# parsing left it reading an already-drained stream, so video uploads reached
# zma-media with no "file" part (MissingServletRequestPartException there),
# surfaced to the client as a bodyless 403. Disabling multipart resolution here
# restores byte-for-byte passthrough of the original multipart body.
spring.servlet.multipart.enabled=false
server.tomcat.max-http-request-header-size=65536

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.redis.enabled=false
