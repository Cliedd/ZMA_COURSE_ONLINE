spring.application.name=zma-gateway
server.port=${SERVER_PORT:8080}

# ── Routes vers les microservices ─────────────────────────────────────────────
gateway.auth-service.url=${AUTH_SERVICE_URL:http://zma-auth:8081}
gateway.users-service.url=${USERS_SERVICE_URL:http://zma-users:8082}
gateway.catalog-service.url=${CATALOG_SERVICE_URL:http://zma-catalog:8083}
gateway.media-service.url=${MEDIA_SERVICE_URL:http://zma-media:8084}
gateway.enrollment-service.url=${ENROLLMENT_SERVICE_URL:http://zma-enrollment:8085}
gateway.payment-service.url=${PAYMENT_SERVICE_URL:http://zma-payment:8086}
gateway.community-service.url=${COMMUNITY_SERVICE_URL:http://zma-community:8087}

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}

# ── Redis (rate limiting) ─────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

# ── Rate limiting ─────────────────────────────────────────────────────────────
gateway.rate-limit.max-requests=${GATEWAY_RATE_LIMIT:100}
gateway.rate-limit.window-seconds=${GATEWAY_RATE_WINDOW:60}

# ── Resilience4j circuit breakers ────────────────────────────────────────────
resilience4j.circuitbreaker.instances.catalog.slidingWindowSize=10
resilience4j.circuitbreaker.instances.catalog.failureRateThreshold=50
resilience4j.circuitbreaker.instances.catalog.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.catalog.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.default.slidingWindowSize=10
resilience4j.circuitbreaker.instances.default.failureRateThreshold=50
resilience4j.circuitbreaker.instances.default.waitDurationInOpenState=30s

# ── Request body size (allow large video uploads through the gateway) ─────────
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
server.tomcat.max-http-request-header-size=65536

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.redis.enabled=false
