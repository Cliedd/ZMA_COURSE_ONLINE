spring.application.name=zma-community
server.port=${SERVER_PORT:8087}

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zma_db}
spring.datasource.username=${DB_USER:zma_admin}
spring.datasource.password=${DB_PASSWORD:devpassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=community

# ── Connection pool ────────────────────────────────────────────────────────────
# See zma-catalog/application.properties for the full rationale: explicit
# sizing keeps the sum across all 7 DB-backed services comfortably under
# Postgres's max_connections=100 (measured ~70 idle connections at rest with
# unset defaults, 2026-08-05).
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ── JWT (validation only) ─────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}

# ── Web Push (VAPID) ──────────────────────────────────────────────────────────
# Pre-generated VAPID keypair (nl.martijndwars:web-push Utils.encode, base64url).
# Overridable per environment via env vars; keep the pair together — the
# public key is handed to browsers on subscribe, the private key signs pushes.
vapid.public-key=${VAPID_PUBLIC_KEY:BHlbSLN8fIqouKSnSz-cLw5yWxQUre84h_DoQL4QoLJwtj23wSY7qOnkaprTWoRKOOBuDt5Nnx7hqaF9GllP3eM}
vapid.private-key=${VAPID_PRIVATE_KEY:RjRG2rH79rCQnSCWlQR9qyERoKPUgq8iu00Elrdhr_w}
vapid.subject=${VAPID_SUBJECT:mailto:contact@zma-academy.example}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
