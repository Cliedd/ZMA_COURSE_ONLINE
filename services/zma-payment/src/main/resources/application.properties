spring.application.name=zma-payment
server.port=${SERVER_PORT:8086}

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zma_db}
spring.datasource.username=${DB_USER:zma_admin}
spring.datasource.password=${DB_PASSWORD:devpassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=payment

# ── JWT (validation only) ─────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

# ── Inter-service clients ─────────────────────────────────────────────────────
enrollment.service.url=${ENROLLMENT_SERVICE_URL:http://zma-enrollment:8085}
catalog.service.url=${CATALOG_SERVICE_URL:http://zma-catalog:8083}
community.service.url=${COMMUNITY_SERVICE_URL:http://zma-community:8087}

# ── CinetPay webhook signature ────────────────────────────────────────────────
# Shared HMAC-SHA256 secret used to verify the "x-token" header on inbound
# CinetPay webhook notifications (POST /api/v1/payments/webhook/cinetpay).
# MUST be overridden via the CINETPAY_WEBHOOK_SECRET environment variable in
# every real deployment — the placeholder below deliberately fails closed
# (it will never match a real CinetPay signature) if left unset.
cinetpay.webhook.secret=${CINETPAY_WEBHOOK_SECRET:CHANGEME_SET_VIA_ENV_VAR}

# ── CinetPay checkout initiation (Orange Money / mobile money) ────────────────
# Real account credentials — separate from the webhook HMAC secret above.
# Get these from the CinetPay merchant dashboard: https://cinetpay.com
cinetpay.api-key=${CINETPAY_API_KEY:}
cinetpay.site-id=${CINETPAY_SITE_ID:}
cinetpay.notify-url=${CINETPAY_NOTIFY_URL:http://zma-gateway:8080/api/v1/payments/webhook/cinetpay}
cinetpay.checkout-url=${CINETPAY_CHECKOUT_URL:https://api-checkout.cinetpay.com/v2/payment}

# ── Stripe (card, PayPal) ──────────────────────────────────────────────────────
# Free to create a Stripe account and get test-mode keys immediately at
# https://dashboard.stripe.com/register — sk_test_/whsec_test_ keys work
# end-to-end without any business verification.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# ── Frontend base URL (Stripe success/cancel, CinetPay return) ────────────────
frontend.url=${FRONTEND_URL:http://localhost}

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
