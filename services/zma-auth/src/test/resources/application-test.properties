# Test profile — used by integration tests running against Testcontainers
# (PostgreSQL + Redis). Datasource and Redis coordinates are injected at
# runtime via @DynamicPropertySource in AbstractIntegrationTest.

jwt.secret=8tNA0cuicRf5NnUO0BTJhs7nCr2HrYtU/bgHvanwUiM=
jwt.expiration-ms=3600000

mail.enabled=false
frontend.url=http://localhost:5173

# Avoid outbound calls to zma-users during tests (fire-and-forget client;
# points at a non-routable-in-CI host so the call fails fast and is swallowed).
users.service.url=http://localhost:65000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=auth
# Auto-create the "auth" schema in the ephemeral Testcontainers Postgres DB
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

management.health.mail.enabled=false
