spring.application.name=zma-auth
server.port=${SERVER_PORT:8081}

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zma_db}
spring.datasource.username=${DB_USER:zma_admin}
spring.datasource.password=${DB_PASSWORD:devpassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=auth

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# ── Redis ─────────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:zma-redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# ── Google OAuth2 ─────────────────────────────────────────────────────────────
# Kept outside the spring.security.oauth2.client.registration.* namespace on
# purpose: Spring Boot's OAuth2ClientPropertiesRegistrationAdapter validates
# client-id/client-secret as non-empty the moment that namespace is bound,
# even if google-login is never actually used — which crashes the whole
# service at boot when no Google credentials are configured. SecurityConfig
# reads these custom keys directly and only registers/enables Google login
# when both are non-blank.
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.scope=profile,email

# ── CORS & Frontend ───────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
frontend.url=${FRONTEND_URL:http://localhost}

# ── Users service (inter-service call on register) ────────────────────────────
users.service.url=${USERS_SERVICE_URL:http://zma-users:8082}

# ── Mail (password reset) ─────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:noreply@ztfmusic.com}
mail.enabled=${MAIL_ENABLED:false}

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Disable SMTP health check — not needed when mail.enabled=false
management.health.mail.enabled=false
