spring.application.name=zma-media
server.port=${SERVER_PORT:8084}

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zma_db}
spring.datasource.username=${DB_USER:zma_admin}
spring.datasource.password=${DB_PASSWORD:devpassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=media

# ── JWT (validation only) ─────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

# ── Storage (R2/S3 or local fallback) ────────────────────────────────────────
storage.type=${STORAGE_TYPE:local}
storage.local.upload-dir=${STORAGE_LOCAL_UPLOAD_DIR:/app/uploads}
storage.r2.account-id=${R2_ACCOUNT_ID:}
storage.r2.access-key=${R2_ACCESS_KEY:}
storage.r2.secret-key=${R2_SECRET_KEY:}
storage.r2.bucket=${R2_BUCKET:zma-media}

# ── Video transcoding (ffmpeg/ffprobe) ────────────────────────────────────────
ffmpeg.binary-path=${FFMPEG_PATH:ffmpeg}
ffmpeg.probe-binary-path=${FFPROBE_PATH:ffprobe}
media.transcode.temp-dir=${MEDIA_TRANSCODE_TEMP_DIR:${java.io.tmpdir}/zma-media-transcode}

# ── Multipart upload limits (local dev direct uploads) ───────────────────────
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
